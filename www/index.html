<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#632626" />
    <title>PedDigital Print</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">PedDigital · QR + impressão</p>
        <h1>Pedido → impressora</h1>
        <p id="mode-label" class="hint-inline">Wi‑Fi do salão</p>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-scan" class="ghost">QR</button>
        <button type="button" id="btn-settings" class="ghost" aria-label="Configurações">⚙</button>
      </div>
    </header>

    <section class="meta">
      <label>Mesa <input id="mesa" type="text" value="12" inputmode="numeric" /></label>
      <label>Comanda <input id="comanda" type="text" value="T1" /></label>
    </section>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-cat="all">Tudo</button>
      <button type="button" class="tab" data-cat="comida">Comida</button>
      <button type="button" class="tab" data-cat="bebida">Bebida</button>
    </nav>

    <main id="menu" class="menu"></main>

    <section class="cart-panel">
      <div class="cart-head">
        <strong>Carrinho</strong>
        <span id="cart-count">0</span>
      </div>
      <ul id="cart-list" class="cart-list"></ul>
      <label class="note">Observação <input id="note" type="text" placeholder="Sem cebola, bem gelado..." /></label>
      <button type="button" id="btn-send" class="primary" disabled>Enviar e imprimir</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <dialog id="settings">
      <form method="dialog" class="settings-form">
        <h2>Salão + impressoras</h2>
        <p class="hint">Android na tomada serve o cardápio na Wi‑Fi. Cliente lê o QR e pede; a impressão sai na Bematech.</p>
        <label>IP cozinha <input id="kitchen-ip" type="text" value="192.168.1.26" /></label>
        <label>IP bar <input id="bar-ip" type="text" value="192.168.1.26" /></label>
        <p id="agent-info" class="hint"></p>
        <div id="qr-box" class="qr-box">
          <canvas id="qr-canvas" width="220" height="220"></canvas>
          <p id="qr-url" class="hint"></p>
        </div>
        <menu>
          <button value="cancel" class="ghost">Fechar</button>
          <button id="btn-save-settings" value="default" class="primary">Salvar</button>
        </menu>
      </form>
    </dialog>

    <dialog id="scan-dialog">
      <div class="settings-form">
        <h2>Ler QR da mesa</h2>
        <div id="qr-reader" class="qr-reader"></div>
        <p class="hint">Aponte para o QR (URL com mesa, peddigital://mesa/12, ou JSON).</p>
        <menu>
          <button type="button" id="btn-close-scan" class="ghost">Fechar</button>
        </menu>
      </div>
    </dialog>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
